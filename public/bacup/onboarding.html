:root{--bg:#070B12;--ink:#EEF3F7;--muted:#9AA7B2;--faint:#66737E;--line:rgba(255,255,255,.1);--glass:rgba(255,255,255,.04);--blue:#1B7FDC;--blue2:#22B8E6;--cy:#7FE3F2;--or:#FF8A3D;--ok:#10B981;--f:"Jakarta",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(70% 50% at 30% -10%,rgba(27,127,220,.28),transparent 70%),radial-gradient(50% 40% at 100% 100%,rgba(13,184,211,.10),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font:inherit;color:inherit}button{cursor:pointer}h1,h2,h3,p{margin:0}
.wm{position:fixed;right:-12vw;bottom:-14vh;width:min(78vw,900px);height:auto;color:#22B8E6;opacity:.045;pointer-events:none;z-index:0;transform:rotate(-8deg)}
.shell{position:relative;z-index:1;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);max-width:1180px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 22px max(18px,env(safe-area-inset-bottom))}
.hdr{display:flex;align-items:center;gap:14px;height:48px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.03em;white-space:nowrap}.brand svg{width:30px;height:26px;color:var(--cy)}
.back{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;flex:none}.back svg{width:18px;height:18px}
.prog{flex:1;display:flex;gap:5px;max-width:420px;margin-left:auto}.prog i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;position:relative}.prog i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--blue2),var(--cy));transform:scaleX(0);transform-origin:0 50%;transition:transform .5s var(--ease)}.prog i.on::after{transform:none}
.main{display:grid;grid-template-columns:minmax(0,1fr);gap:56px;align-items:center;flex:1;padding:24px 0 8px}
.col{display:flex;flex-direction:column;min-height:calc(100dvh - 120px);max-width:560px;width:100%;margin:0 auto}
.stage{position:relative;flex:1;display:grid}
.side{display:none}
@media (min-width:980px){.shell{padding:28px 48px}.main{grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:clamp(48px,7vw,110px);padding:4vh 0}.col{min-height:min(720px,calc(100dvh - 140px));margin:0}.side{display:grid;place-items:center;position:sticky;top:12vh}}
.scr{grid-area:1/1;display:flex;flex-direction:column;padding-top:26px;opacity:0;visibility:hidden;transform:translateY(18px);filter:blur(6px);transition:opacity .35s var(--ease),transform .45s var(--ease),filter .35s,visibility 0s .45s}
.scr.on{opacity:1;visibility:visible;transform:none;filter:none;transition:opacity .45s .08s var(--ease),transform .55s .08s var(--ease),filter .45s .08s,visibility 0s}
.k{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--cy)}.k svg{width:18px;height:16px}
.q{margin-top:14px;font-size:clamp(30px,4.2vw,46px);font-weight:800;letter-spacing:-.05em;line-height:1.03;text-wrap:balance}.q .soft{color:#7B8794}
.sub{margin-top:14px;color:var(--muted);font-size:16px;max-width:30em}
.lab{margin:34px 0 12px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
/* QCU-style answers */
.os{display:grid;gap:10px}.os.two{grid-template-columns:1fr 1fr}
.o{position:relative;display:flex;align-items:center;gap:16px;width:100%;min-height:62px;padding:12px 16px 12px 12px;border-radius:18px;border:1px solid var(--line);background:var(--glass);text-align:left;font-weight:700;font-size:16.5px;letter-spacing:-.015em;transition:border-color .25s,background .25s,transform .15s,box-shadow .25s}
.o:hover{border-color:rgba(255,255,255,.22)}.o:active{transform:scale(.985)}
.o .l{position:relative;flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.06);font-size:15px;font-weight:800;color:#93A1B3;transition:all .25s}
.o .l svg{position:absolute;width:20px;height:20px;opacity:0;transform:scale(.4);transition:all .3s cubic-bezier(.3,1.5,.5,1)}
.o small{display:block;font-weight:500;font-size:13px;color:var(--muted);letter-spacing:0;margin-top:1px}
.o[aria-pressed="true"]{border-color:#34D399;background:rgba(16,185,129,.12);box-shadow:0 0 30px -6px rgba(52,211,153,.45)}
.o[aria-pressed="true"] .l{background:#10B981;color:transparent}.o[aria-pressed="true"] .l svg{opacity:1;transform:none}
.fl input,.inp{margin-top:26px;height:62px;width:100%;padding:0 20px;border-radius:18px;border:1px solid var(--line);background:var(--glass);outline:0;font-size:21px;font-weight:700;letter-spacing:-.02em;transition:border-color .2s,box-shadow .2s}.fl input::placeholder,.inp::placeholder{color:#55606B}.fl input:focus,.inp:focus{border-color:rgba(127,227,242,.7);box-shadow:0 0 0 4px rgba(34,184,230,.14)}
.inp.sm{margin-top:0;height:52px;font-size:16px;font-weight:600;border-radius:14px}
.foot{margin-top:auto;padding-top:34px;display:grid;gap:10px}
.cta{position:relative;overflow:hidden;height:60px;border:0;border-radius:99px;font-weight:800;font-size:16.5px;color:#0B1520;background:#fff;box-shadow:0 18px 40px -18px rgba(127,227,242,.7);transition:opacity .25s,transform .15s}.cta:active{transform:scale(.98)}.cta:disabled{opacity:.22;box-shadow:none}
.cta.bl{color:#fff;background:linear-gradient(135deg,#22B8E6,#1B7FDC)}
.cta::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.45) 50%,transparent 60%);transform:translateX(-110%)}.cta.sw::after{animation:sw 3.5s 1s ease-in-out infinite}@keyframes sw{0%{transform:translateX(-110%)}35%,100%{transform:translateX(110%)}}
.ghost{height:44px;border:0;background:none;color:var(--muted);font-weight:700;font-size:14.5px}
.note{font-size:12.5px;color:var(--faint);text-align:center}
/* login */
.hello{padding-top:5vh}
.orb{width:96px;height:96px;border-radius:28px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(34,184,230,.25),rgba(27,127,220,.08));border:1px solid rgba(127,227,242,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 30px 80px -20px rgba(34,184,230,.6)}.orb svg{width:54px;height:48px;color:#fff}
.hello h1{margin-top:30px;font-size:clamp(36px,5.4vw,58px);font-weight:800;letter-spacing:-.055em;line-height:1}.hello h1 em{font-style:normal;color:var(--cy)}
.hello p{margin-top:16px;color:var(--muted);max-width:24em;font-size:17px}
.refb{display:inline-flex;align-items:center;gap:8px;margin-top:20px;padding:8px 14px;border-radius:99px;font-size:13.5px;font-weight:700;color:#FFB27A;background:rgba(255,106,26,.1);border:1px solid rgba(255,138,61,.4)}
.sso{display:grid;gap:10px;margin-top:auto;padding-top:34px;max-width:440px}
.sbtn{display:flex;align-items:center;justify-content:center;gap:12px;height:58px;border-radius:99px;border:1px solid var(--line);background:var(--glass);font-weight:700;font-size:16px}.sbtn svg{width:20px;height:20px}.sbtn.g{background:#fff;color:#0B1520;border-color:#fff}
.or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:13px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

.bl2{margin-top:30px;display:grid;gap:14px}.bi{display:flex;align-items:center;gap:12px;font-weight:700;font-size:16px;color:#55606B;transition:color .3s}.bi i{width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(255,255,255,.15);display:grid;place-items:center;flex:none;transition:all .3s}.bi i svg{width:12px;opacity:0}.bi.ok{color:var(--ink)}.bi.ok i{background:var(--ok);border-color:var(--ok)}.bi.ok i svg{opacity:1}

.seg{position:relative;display:inline-flex;padding:4px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}.seg .th{position:absolute;top:4px;bottom:4px;left:4px;border-radius:99px;background:linear-gradient(135deg,rgba(34,184,230,.35),rgba(27,127,220,.25));border:1px solid rgba(127,227,242,.45);transition:transform .45s var(--ease),width .45s var(--ease)}

@media (max-width:979px){.mcard{display:block;margin:14px auto 0;width:min(78%,320px)}.mcard[hidden]{display:none}
 .idc.mini{border-radius:18px;padding:6% 7%;transform:perspective(900px) rotateX(6deg)}.idc.mini .t span{font-size:13px;gap:6px}.idc.mini .t svg{width:20px;height:18px}.idc.mini .t em{font-size:8px}.idc.mini .av.big{width:34px;height:34px}.idc.mini .nm{font-size:19px}.idc.mini .who{gap:9px}.idc.mini .cc{font-size:9.5px;padding:3px 7px 3px 5px;gap:4px}.idc.mini .cc svg{width:11px;height:11px}
 .scr{padding-top:16px}.avs{grid-template-columns:repeat(5,1fr);gap:7px}.av{width:40px;height:40px}}

/* ===== v5: glass medals, year paths, school lines, physical card, crop ===== */

 <div class="pay"><button class="pm" data-p="card" aria-pressed="${A.pay==="card"}">${md("pcard","pmd")}Carte bancaire<small>Accès immédiat</small><span class="plg"><i><b class="cmi" title="CMI">CMI</b></i><i><svg viewBox="0 7.9 24 8.2" role="img" aria-label="Visa"><path fill="#1434CB" d="M9.112 8.262L5.97 15.758H3.92L2.374 9.775c-.094-.368-.175-.503-.461-.658C1.447 8.864.677 8.627 0 8.479l.046-.217h3.3a.904.904 0 01.894.764l.817 4.338 2.018-5.102zm8.033 5.049c.008-1.979-2.736-2.088-2.717-2.972.006-.269.262-.555.822-.628a3.66 3.66 0 011.913.336l.34-1.59a5.207 5.207 0 00-1.814-.333c-1.917 0-3.266 1.02-3.278 2.479-.012 1.079.963 1.68 1.698 2.04.756.367 1.01.603 1.006.931-.005.504-.602.725-1.16.734-.975.015-1.54-.263-1.992-.473l-.351 1.642c.453.208 1.289.39 2.156.398 2.037 0 3.37-1.006 3.377-2.564m5.061 2.447H24l-1.565-7.496h-1.656a.883.883 0 00-.826.55l-2.909 6.946h2.036l.405-1.12h2.488zm-2.163-2.656l1.02-2.815.588 2.815zm-8.16-4.84l-1.603 7.496H8.34l1.605-7.496z"/></svg></i><i class="mc"><svg viewBox="0 0 38 24" role="img" aria-label="Mastercard"><circle cx="13" cy="12" r="10" fill="#EB001B"/><circle cx="25" cy="12" r="10" fill="#F79E1B"/><path d="M19 4a10 10 0 0 0 0 16 10 10 0 0 0 0-16Z" fill="#FF5F00"/></svg></i></span></button><button class="pm" data-p="cod" aria-pressed="${A.pay==="cod"}">${md("pcod","pmd")}À la livraison<small>Tu paies en espèces</small><span class="pml"><b>Espèces</b><b>24 à 48 h</b></span></button></div>
 <div class="codef" id="codef" ${A.pay==="cod"?"":"hidden"}><div class="dlv"><span class="env "><i class="eb"></i><i class="ec"><svg><use href="#logo"/></svg><u></u></i><i class="ef"><svg viewBox="0 0 64 30" preserveAspectRatio="none"><path d="M0 0 32 17 64 0"/></svg></i></span><div><b>Livraison partout au Maroc</b><small>Ta carte d'activation arrive chez toi en 24 à 48 h. Tu paies le livreur en espèces.</small></div></div><input class="inp sm" id="ph" type="tel" inputmode="tel" placeholder="Téléphone · 06 12 34 56 78" value="${A.phone}"><input class="inp sm" id="ct" placeholder="Ville" value="${A.city}" list="cities"><datalist id="cities">${["Casablanca","Rabat","Fès","Marrakech","Tanger","Agadir","Meknès","Oujda","Kénitra","Tétouan","Salé","Témara"].map(c=>`<option value="${c}">`).join("")}</datalist><input class="inp sm" id="ad" placeholder="Adresse de livraison" value="${A.addr}"></div>
 <div id="promo"></div>
 <div class="sum" id="sum"></div>`;}
function renderPromo(){const p=$("#promo");if(!p)return;
 p.innerHTML=A.code?`<div class="applied"><svg viewBox="0 0 24 24"><use href="#tag"/></svg>Code ${A.code} appliqué · −${CFG.refDiscount} DH<button id="rmc">Retirer</button></div>`:`<div class="promo"><input class="inp sm" id="pc" placeholder="Code promo ou ambassadeur" autocapitalize="characters"><button id="apc">Appliquer</button></div>`;
 const r=$("#rmc");if(r)r.onclick=()=>{A.code="";renderPromo();renderSum()};const a=$("#apc");if(a)a.onclick=()=>{const v=$("#pc").value.toUpperCase().replace(/[^A-Z0-9]/g,"");if(v.length<4){$("#pc").focus();return}if(!window.BacupAuth){A.code=v;renderPromo();renderSum();return}a.disabled=true;BacupAuth.checkPromo(v).then(r=>{A.code=r.code;A.codeOk=1;renderPromo();renderSum()}).catch(()=>{a.disabled=false;const i=$("#pc");i.value="";i.placeholder="Code invalide ou inactif";i.focus()})};}
function renderSum(){const s=$("#sum");if(!s)return;
 s.innerHTML=`<div class="r"><span>Accès complet · jusqu’au 31 juillet 2027</span><b>${fmt(CFG.price)}</b></div>${A.code?`<div class="r d"><span>Code ${A.code}</span><b>−${fmt(CFG.refDiscount)}</b></div>`:""}${A.pay==="cod"?`<div class="r"><span>Livraison de la carte</span><b>${fmt(CFG.delivery)}</b></div>`:""}<div class="r tot"><span>${A.pay==="cod"?"À payer à la livraison":"Total"}</span><b>${fmt(total())}</b></div>`;
 const b=$("#next");if(b)b.textContent=SC.checkout.cta();upd();}
function payJS(){renderPromo();renderSum();if(A.code&&!A.codeOk&&window.BacupAuth)BacupAuth.checkPromo(A.code).then(r=>{A.code=r.code;A.codeOk=1;renderPromo();renderSum()}).catch(()=>{A.code="";renderPromo();renderSum()});
 document.querySelectorAll(".pm").forEach(b=>b.onclick=()=>{A.pay=b.dataset.p;document.querySelectorAll(".pm").forEach(x=>x.setAttribute("aria-pressed",x===b));$("#codef").hidden=A.pay!=="cod";renderSum()});
 [["ph","phone"],["ct","city"],["ad","addr"]].forEach(([i,k])=>{const e=$("#"+i);e.oninput=()=>{A[k]=e.value.trim();upd()}});}
/* side preview */
function cardHTML(mini){const sch=A.ecole&&A.ecole!=="Pas encore décidé";
 const ch=(m,v,p,hot)=>`<span class="cc${v?"":" ph"}${v&&hot?" hot":""}">${v?md(m,"mc"):'<span class="av md e mc"></span>'}${v||p}</span>`;
 return `<div class="idc${mini?" mini":""}"><div class="ic-top"><span class="ic-l">${LOGO}Bac Up</span><span class="ic-chip"></span></div><div class="who">${avHTML(A.av,A.photo,"big")}<div class="nm${A.name?"":" ph"}">${A.name||"Ton pseudo"}</div></div><div class="row">${ch(IS1()?"y1":"y2",A.niveau&&A.filiere?A.niveau+" · "+A.filiere:"","Année")}${ch(gMed(),gTxt(1),"Objectif")}${IS1()?"":ch(SCM[A.ecole],sch?A.ecole:"","École",1)}</div><div class="ic-c"><span>BU · 2027 · ${MEM}</span><em class="${A.paid?"f":""}">${A.paid?"Membre Fondateur":"Carte élève"}</em></div></div>`;}
function side(){LS.set({av:A.av,photo:A.photo,name:A.name,niveau:A.niveau,filiere:A.filiere,mention:A.mention,ecole:A.ecole});const m=$("#mcard");if(m){const show=["name","profil","note","ecole"].includes(F[i]);m.hidden=!show;if(show)m.innerHTML=cardHTML(1);}
 const el=$("#side");if(!el||getComputedStyle(el).display==="none")return;
 el.innerHTML=`<div class="pv">${cardHTML()}<p class="pvn">${A.paid?"Ton accès complet est ouvert.":A.cod?"Ta carte d'activation arrive sous 24 à 48 h.":A.ecole&&SCL[A.ecole]&&F[i]==="ecole"?SCL[A.ecole]:"Ta carte élève se remplit avec tes réponses."}</p></div>`;}
/* engine */
let i=0,F=flow();const stage=$("#stage"),prog=$("#prog");
function upd(){const b=$("#next"),s=SC[F[i]];if(b&&s.ok)b.disabled=!s.ok()}
function render(dir){F=flow();const id=F[i],s=SC[id];const old=stage.querySelector(".scr.on");if(old){old.classList.remove("on");setTimeout(()=>old.remove(),450)}
 const el=document.createElement("div");el.className="scr";const cta=typeof s.cta==="function"?s.cta():s.cta,gh=typeof s.ghost==="function"?s.ghost():s.ghost;
 el.innerHTML=s.html()+(id==="login"||id==="build"||s.auto?"":`<div class="foot"><button class="cta${id==="checkout"?" bl sw":""}" id="next">${cta||"Continuer"}</button>${gh?`<button class="ghost" id="ghost">${gh}</button>`:""}${id==="checkout"?'<p class="note">Paiement unique · Pas d\'abonnement</p>':""}</div>`);
 stage.appendChild(el);requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add("on")));
 const steps=F.filter(x=>x!=="login"&&x!=="build"&&x!=="done"),pos=steps.indexOf(id);prog.innerHTML=steps.map((x,k)=>`<i class="${k<=pos||id==="done"?"on":""}"></i>`).join("");
 $("#back").style.visibility=(i===0||["build","paid","cod","done"].includes(id)||["paid","cod"].includes(F[i-1]))?"hidden":"visible";
 wire(el,s,id);if(s.after)s.after();side();scrollTo(0,0);if(id==="build")saveProfile();}
function next(){if(i<F.length-1){i++;render()}}
function wire(el,s,id){
 if(id==="login"&&window.BacupAuth){BacupAuth.mountLogin(el,{onDone:afterLogin})}else{el.querySelectorAll("[data-go]").forEach(b=>b.onclick=next);
 const mb=el.querySelector("#mailb");if(mb)mb.onclick=()=>{const f=$("#mailf");if(f.hidden){f.hidden=false;$("#mail").focus();mb.textContent="Continuer";mb.classList.add("g")}else if(/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test($("#mail").value))next();else $("#mail").focus()};}
 el.querySelectorAll(".avb[data-av]").forEach(b=>b.onclick=()=>{A.av=b.dataset.av;A.photo="";el.querySelectorAll(".avb").forEach(x=>x.setAttribute("aria-pressed",x===b));side()});
 const uf=el.querySelector("#upf");if(uf)uf.onchange=()=>{const f=uf.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{uf.value="";openCrop(r.result)};r.readAsDataURL(f)};
 const nm=el.querySelector("#nm");if(nm){nm.oninput=()=>{A.name=nm.value.trim();upd();side()};nm.onkeydown=e=>{if(e.key==="Enter"&&s.ok())next()};setTimeout(()=>nm.focus(),400)}
 el.addEventListener("click",e=>{const b=e.target.closest(".o[data-k]");if(!b)return;const k=b.dataset.k,ch=A[k]!==b.dataset.v;A[k]=b.dataset.v;el.querySelectorAll(`.o[data-k="${k}"]`).forEach(x=>x.setAttribute("aria-pressed",x===b));
   if(k==="niveau"&&ch){A.filiere="";A.mention="";A.ecole="";const f=el.querySelector("#fil");f.innerHTML=filHTML();f.classList.remove("in");void f.offsetWidth;f.classList.add("in");const y=el.querySelector("#ysub");y.textContent=YS[A.niveau];y.classList.remove("in");void y.offsetWidth;y.classList.add("in");}
   upd();side();if(s.auto)setTimeout(next,420)});
 const nx=el.querySelector("#next");if(nx){upd();nx.onclick=()=>{
   if(id==="checkout"){checkout(nx);return}
   if(id==="done"||(id==="paid"&&ENTRY==="start")){goApp();return}next();}}
 const gh=el.querySelector("#ghost");if(gh)gh.onclick=()=>{A.paid=false;A.cod=false;F=flow();i=F.indexOf("done");render()};}

/* photo crop */
const CR={img:null,z:1,x:0,y:0,s0:1,V:240};
function placeCrop(){const im=CR.img,V=CR.V,dw=im.naturalWidth*CR.s0*CR.z,dh=im.naturalHeight*CR.s0*CR.z,mx=(dw-V)/2,my=(dh-V)/2;CR.x=Math.max(-mx,Math.min(mx,CR.x));CR.y=Math.max(-my,Math.min(my,CR.y));im.style.width=dw+"px";im.style.height=dh+"px";im.style.transform=`translate(${-dw/2+CR.x}px,${-dh/2+CR.y}px)`;const z=$("#cz");z.style.setProperty("--p",((CR.z-1)/2*100)+"%");}
function openCrop(src){const c=$("#crop"),im=$("#ci");c.hidden=false;requestAnimationFrame(()=>c.classList.add("on"));im.onload=()=>{CR.img=im;CR.V=$("#cv").clientWidth;CR.z=1;CR.x=0;CR.y=0;CR.s0=CR.V/Math.min(im.naturalWidth,im.naturalHeight);$("#cz").value=1;placeCrop();};im.src=src;}
function closeCrop(){const c=$("#crop");c.classList.remove("on");setTimeout(()=>c.hidden=true,280);}
(function(){const cv=$("#cv");let d=null;
 cv.addEventListener("pointerdown",e=>{if(!CR.img)return;d={x:e.clientX,y:e.clientY,ox:CR.x,oy:CR.y};cv.setPointerCapture(e.pointerId);cv.classList.add("drag")});
 cv.addEventListener("pointermove",e=>{if(!d)return;CR.x=d.ox+e.clientX-d.x;CR.y=d.oy+e.clientY-d.y;placeCrop()});
 const up=()=>{d=null;cv.classList.remove("drag")};cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
 cv.addEventListener("wheel",e=>{if(!CR.img)return;e.preventDefault();CR.z=Math.max(1,Math.min(3,CR.z-e.deltaY*.002));$("#cz").value=CR.z;placeCrop()},{passive:false});
 $("#cz").oninput=e=>{CR.z=+e.target.value;placeCrop()};
 $("#cx").onclick=closeCrop;$("#crop").addEventListener("click",e=>{if(e.target.id==="crop")closeCrop()});
 document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#crop").hidden)closeCrop()});
 $("#cok").onclick=()=>{const im=CR.img,V=CR.V,O=320,k=O/V,dw=im.naturalWidth*CR.s0*CR.z,dh=im.naturalHeight*CR.s0*CR.z,c=document.createElement("canvas");c.width=c.height=O;const g=c.getContext("2d");g.drawImage(im,(V/2-dw/2+CR.x)*k,(V/2-dh/2+CR.y)*k,dw*k,dh*k);A.photo=c.toDataURL("image/jpeg",.9);closeCrop();render();};})();
$("#back").onclick=()=>{let n=i-1;if(F[n]==="build")n--;if(n>=0){i=n;render(-1)}};
const dm={start:"dS",buy:REF?"dR":"dB"};const de=document.getElementById(dm[ENTRY]);if(de)de.classList.add("on");
/* profile -> server (POST /api/me/profile) */
let SAVE=Promise.resolve();function saveProfile(){if(!window.BacupAuth)return;SAVE=BacupAuth.saveProfile({pseudo:A.name,avatarKey:A.av,level:A.niveau,stream:A.filiere,average:A.note,goal:A.mention,dreamSchool:A.ecole}).catch(()=>{})}
function goApp(){saveProfile();Promise.race([SAVE,new Promise(r=>setTimeout(r,4000))]).then(()=>{location.href=CFG.app})}
/* checkout -> POST /api/orders (card: Whop page, cod: real order ref) */
const ORDER=(Q.get("order")||"").toUpperCase().replace(/[^A-Z0-9-]/g,"").slice(0,12);
const PERR={card_unavailable:"Le paiement par carte n'est pas encore disponible. Choisis le paiement à la livraison ou continue avec le compte gratuit.",already_active:"Ton accès complet est déjà ouvert.",level_locked:"Bac Up 1bac ouvre en décembre.",bad_delivery:"Vérifie ton numéro, ta ville et ton adresse.",not_authenticated:"Ta session a expiré. Recharge la page pour te reconnecter.",network:"Connexion impossible. Réessaie dans un instant."};
function payErr(t){let e=$("#payerr");if(!e){e=document.createElement("p");e.id="payerr";e.className="note";e.setAttribute("role","alert");e.style.cssText="color:#F87171;margin:0 0 10px";const f=document.querySelector(".scr.on .foot");if(f)f.prepend(e);else return}e.textContent=t}
async function checkout(btn){if(!window.BacupAuth)return;btn.disabled=true;const old=btn.textContent;btn.textContent=A.pay==="cod"?"Enregistrement…":"Redirection vers le paiement…";
 try{saveProfile();await SAVE;const r=await BacupAuth.createOrder({method:A.pay,promoCode:A.code||"",via:A.code&&A.code===REF?"link":"code",phone:A.phone,city:A.city,address:A.addr,entry:ENTRY});
  if(r.method==="card"&&r.paymentUrl){location.href=r.paymentUrl;return}
  A.cod=true;A.paid=false;A.orderRef=r.orderRef;F=flow();next();}
 catch(e){btn.disabled=false;btn.textContent=old;if(e.code==="already_active"){location.href=CFG.app;return}payErr(PERR[e.code]||PERR.network)}}
function waitPaid(){const st=$("#stage");if(st)st.innerHTML='<div class="scr on"><div class="hello"><h2 class="q">Vérification de ton paiement…</h2><p class="sub">Quelques secondes, ne ferme pas la page.</p></div></div>';let n=0;
 const again=()=>{if(++n<30)setTimeout(tick,2000);else{i=Math.max(0,F.indexOf("checkout"));render();setTimeout(()=>payErr("Paiement en cours de vérification. Si ta carte a été débitée, ton accès s'ouvre dans quelques minutes."),400)}};
 const tick=()=>BacupAuth.orderStatus(ORDER).then(o=>{if(o.status==="paid"){A.paid=true;A.cod=false;F=flow();i=Math.max(0,F.indexOf("paid"));render()}else again()}).catch(again);tick()}
/* session (BacupAuth): pre-fill from the server, skip what is known */
function afterLogin(m){if(!m||!m.user)return;BAC1_OPEN=!!(m.flags&&m.flags.level1bac);const s=m.student||{};if(s.pseudo)A.name=s.pseudo;if(s.avatarKey)A.av=s.avatarKey;if(s.photoUrl)A.photo=s.photoUrl;if(s.level&&s.stream){A.niveau=s.level;A.filiere=s.stream}PRE.name=A.name.length>1;PRE.profil=!!(A.niveau&&A.filiere);if(s.memberNumber)MEM=String(s.memberNumber).padStart(5,"0");if(ORDER){waitPaid();return}if(s.status==="active"){location.href=CFG.app;return}if(ENTRY==="start"&&s.complete&&s.status==="demo"){location.href=CFG.app;return}if(s.complete&&s.level==="1bac"&&!BAC1_OPEN){location.href=CFG.app;return}if(F[i]==="login")next()}
render();
if(window.BacupAuth)BacupAuth.me().then(m=>{if(m&&m.user&&F[i]==="login")afterLogin(m)});
</script>
