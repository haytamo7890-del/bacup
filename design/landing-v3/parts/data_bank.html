"maths_std":{"subject":"Maths","chapter":"Suites numériques","qs":[
 {"n":"Convergence monotone","d":1,"s":"Le niveau d'eau $u_n$ (en mètres) d'un réservoir, relevé chaque matin, augmente d'un jour à l'autre, et on a démontré que $u_n \\le 4$ pour tout $n$ (la hauteur du réservoir). Sans autre calcul, que peut-on affirmer ?","h":"Quel théorème relie « croissante », « majorée » et « convergente » ? Que dit-il de la valeur de la limite ?","m":"Croissante et majorée, ou décroissante et minorée : la suite converge. Le théorème donne l'existence de la limite, pas sa valeur ; $\\ell$ respecte les inégalités larges.","o":[["$(u_n)$ converge vers un réel $\\ell \\le 4$",1,"Croissante et majorée, donc convergente ; l'inégalité large $u_n \\le 4$ passe à la limite."],["$(u_n)$ converge vers $4$",0,"Un majorant n'est pas forcément la limite : $u_n = 2 - \\frac{1}{n+1}$ est croissante, majorée par $4$, et tend vers $2$."],["$(u_n)$ tend vers $+\\infty$, puisqu'elle augmente chaque jour",0,"Croissante ne suffit pas pour tendre vers $+\\infty$ : il faudrait qu'elle ne soit pas majorée. Ici elle reste sous $4$."],["$(u_n)$ converge vers un réel $\\ell < 4$ (strictement)",0,"La limite peut égaler le majorant : $u_n = 4 - \\frac{1}{n+1}$ est croissante, majorée par $4$, et tend vers $4$."]]},
 {"n":"Convergence monotone","d":2,"s":"Dans un QCM de révision, un seul des énoncés suivants est un théorème du cours, c'est-à-dire vrai pour toute suite réelle. Lequel ?","h":"Pour éliminer un énoncé général, un seul contre-exemple suffit.","m":"Une suite monotone a toujours une limite : finie si elle est bornée du « bon côté », infinie sinon.","o":[["Toute suite croissante non majorée tend vers $+\\infty$",1,"Pour tout $A$, un terme $u_N$ dépasse $A$ (non majorée), et tous les suivants aussi (croissante)."],["Toute suite convergente est monotone",0,"Contre-exemple : $u_n = \\frac{(-1)^n}{n}$ converge vers $0$ en changeant de sens à chaque rang."],["Toute suite bornée converge",0,"Contre-exemple : $u_n = (-1)^n$ est bornée par $1$ mais n'a pas de limite."],["Toute suite décroissante tend vers $-\\infty$",0,"Contre-exemple : $u_n = \\frac1n$ est décroissante et tend vers $0$ ; elle est minorée par $0$."]]},
 {"n":"Le raisonnement par récurrence","d":1,"s":"On veut démontrer par récurrence que, pour tout entier $n \\ge 1$, $1 + 3 + 5 + \\dots + (2n - 1) = n^2$ (propriété $P(n)$). L'initialisation est faite. Quelle rédaction de l'hérédité est correcte ?","h":"L'hérédité part de $P(n)$ pour un $n$ fixé et arrive à $P(n+1)$. Quel terme s'ajoute quand on passe de $n$ à $n+1$ ?","m":"Hérédité : « Soit $n$ fixé tel que $P(n)$ est vraie ; montrons $P(n+1)$ ». Repère ce qui change entre les rangs $n$ et $n+1$ et utilise l'hypothèse.","o":[["Soit $n \\ge 1$ tel que $P(n)$ est vraie ; alors $1 + 3 + \\dots + (2n-1) + (2n+1) = n^2 + 2n + 1 = (n+1)^2$",1,"On fixe un $n$, on utilise $P(n)$ pour remplacer la somme par $n^2$, puis on ajoute le terme suivant $2n+1$."],["Supposons $P(n)$ vraie pour tout $n \\ge 1$ ; alors $P(n+1)$ est vraie",0,"Tu supposes ce qu'il faut démontrer : l'hypothèse de récurrence porte sur UN entier $n$ fixé, pas sur tous les entiers."],["Soit $n \\ge 1$ tel que $P(n+1)$ est vraie ; en retranchant $2n+1$, on obtient $P(n)$",0,"Tu as inversé le sens : l'hérédité va de $P(n)$ vers $P(n+1)$, sinon on ne « monte » pas le long des entiers."],["$P(1)$, $P(2)$ et $P(3)$ sont vraies ($1$, $4$, $9$), donc $P(n)$ l'est aussi",0,"Quelques vérifications ne prouvent rien pour tous les entiers : c'est une conjecture, pas une hérédité."]]},
 {"n":"Le raisonnement par récurrence","d":2,"s":"Soit $(u_n)$ définie par $u_0 = 2$ et $u_{n+1} = 2u_n - 3$. On conjecture que $u_n = 3 - 2^n$ pour tout $n\\in\\mathbb{N}$. Dans l'hérédité, on suppose $u_n = 3 - 2^n$ pour un $n$ fixé. Quel calcul établit correctement la propriété au rang $n+1$ ?","h":"Écris $u_{n+1}$ avec la relation de récurrence, remplace $u_n$ par l'hypothèse, puis simplifie la puissance.","m":"Formule explicite par récurrence : $u_{n+1} = $ (relation) $=$ (hypothèse remplacée) $= \\dots =$ formule au rang $n+1$. On va toujours du connu vers le but.","o":[["$u_{n+1} = 2(3 - 2^n) - 3 = 3 - 2^{n+1}$",1,"On part de la relation de récurrence, on remplace $u_n$ grâce à l'hypothèse, et $2\\times 2^n = 2^{n+1}$."],["$u_{n+1} = 2(3 - 2^n) - 3 = 3 - 4^n$",0,"Tu as écrit $2 \\times 2^n = 4^n$ : multiplier par $2$ ajoute $1$ à l'exposant. Pour $n = 2$ : $2\\times 2^2 = 8$, alors que $4^2 = 16$."],["$u_{n+1} = 3 - 2^{n+1}$, donc $2u_n - 3 = 3 - 2^{n+1}$, d'où $u_n = 3 - 2^n$",0,"Tu pars de ce que tu veux démontrer pour retrouver l'hypothèse : ce raisonnement montre $P(n+1) \\Rightarrow P(n)$, c'est le mauvais sens."],["$u_1 = 2\\times2 - 3 = 1 = 3 - 2^1$, donc la formule est vraie",0,"Ce n'est qu'une vérification au rang $1$ (une initialisation). Elle ne dit rien des rangs suivants."]]},
 {"n":"Suites géométriques","d":1,"s":"$(u_n)$ géométrique, $u_0=5$, $q=\\frac{1}{2}$. Limite ?","h":null,"m":null,"o":[["$0$",1,null],["$5$",0,null],["$+\\infty$",0,null],["$\\frac{1}{2}$",0,null]]},
 {"n":"Suites géométriques","d":2,"s":"Une suite géométrique $(u_n)$ à termes strictement positifs vérifie $u_2 = 12$ et $u_5 = 96$. Pour écrire sa formule explicite, on a besoin de son premier terme $u_0$. Il vaut :","h":"Le quotient $\\frac{u_5}{u_2}$ est une puissance de $q$ : laquelle ?","m":"Géométrique : $u_n = u_p\\, q^{n-p}$. Le quotient de deux termes donne une puissance de $q$, dont l'exposant est l'écart des indices.","o":[["$3$",1,"$q^3 = \\frac{96}{12} = 8$ donc $q = 2$, puis $u_0 = \\frac{u_2}{q^2} = \\frac{12}{4} = 3$."],["$6$",0,"C'est $u_1 = \\frac{12}{2}$ : tu n'as divisé qu'une fois par $q$. De $u_2$ à $u_0$ il y a deux pas."],["$\\dfrac{3}{16}$",0,"Tu as pris $q = 8$ ; or $\\frac{u_5}{u_2} = q^{5-2} = q^3$, donc $q^3 = 8$ et $q = 2$."],["$-44$",0,"Tu as raisonné comme pour une suite arithmétique ($3r = 84$, $r = 28$). Ici on passe d'un terme au suivant en multipliant."]]}
]},
"maths_sm":{"subject":"Maths","chapter":"Limites et continuité","qs":[
 {"n":"Théorème des valeurs intermédiaires","d":1,"s":"$f$ continue sur $[0, 2]$, $f(0)=1$, $f(2)=5$. La valeur $3$ est-elle atteinte ?","h":"Compare $3$ avec $f(0)$ et $f(2)$.","m":"TVI : si $f$ est continue sur $[a,b]$ et $k$ est compris entre $f(a)$ et $f(b)$, il existe $c\\in[a,b]$ tel que $f(c)=k$.","o":[["Oui, d'après le TVI",1,"Juste : la continuité et $1\\le3\\le5$ suffisent."],["Non",0,"Le TVI garantit au contraire l'existence d'un antécédent de $3$."],["Seulement si $f$ monotone",0,"La monotonie donne l'unicité, pas l'existence."],["On ne peut pas savoir",0,"Toutes les hypothèses du TVI sont réunies : on peut conclure."]]},
 {"n":"Théorème des valeurs intermédiaires","d":1,"s":"Soit $f(x) = x^3 + 2x - 5$. La fonction $f$ est continue et strictement croissante sur $\\mathbb{R}$, et l'équation $f(x) = 0$ admet une unique solution $\\alpha$. On donne $f(1{,}2) = -0{,}872$, $f(1{,}3) = -0{,}203$, $f(1{,}4) = 0{,}544$. Dans quel intervalle se trouve $\\alpha$ ?","h":"Cherche les deux valeurs consécutives entre lesquelles $f$ change de signe.","m":"Localiser $\\alpha$ : trouve deux valeurs où $f$ change de signe ; la stricte monotonie garantit qu'il n'y a qu'une solution.","o":[["$]1{,}3\\,;1{,}4[$",1,"$f(1{,}3) < 0 < f(1{,}4)$ et $f$ est continue strictement croissante : $\\alpha$ est entre $1{,}3$ et $1{,}4$."],["$]1{,}2\\,;1{,}3[$",0,"$f(1{,}2)$ et $f(1{,}3)$ sont tous deux négatifs : pas de changement de signe, donc pas de solution entre eux."],["$]1{,}4\\,;1{,}5[$",0,"$f(1{,}4) > 0$ et $f$ est croissante : $f(x) > 0$ pour tout $x \\ge 1{,}4$, la solution est avant."],["$]1\\,;1{,}2[$",0,"$f(1) = -2$ et $f(1{,}2) = -0{,}872$ sont négatifs : aucun changement de signe sur cet intervalle."]]},
 {"n":"Techniques de levée","d":2,"s":"Calculer $\\lim_{x \\to +\\infty}\\left(\\sqrt{x^{2}+3x}-x\\right)$.","h":"Forme $\\infty-\\infty$ avec une racine : pense à l'expression conjuguée.","m":"Multiplier par l'expression conjuguée, puis factoriser par le terme dominant.","o":[["$\\frac{3}{2}$",1,"Juste : après conjugaison, $\\frac{3}{\\sqrt{1+\\frac3x}+1}\\to\\frac32$."],["$3$",0,"Le dénominateur est oublié : il tend vers $2$ après factorisation."],["$0$",0,"$\\sqrt{x^{2}+3x}$ et $x$ sont équivalents, mais leur différence ne tend pas vers $0$."],["$+\\infty$",0,"La forme $\\infty-\\infty$ est indéterminée ; la conjugaison montre que la limite est finie."]]},
 {"n":"Techniques de levée","d":2,"s":"Calculer $\\lim_{x \\to 0}\\frac{\\sqrt{1+x}-1}{x}$.","h":"Multiplie numérateur et dénominateur par $\\sqrt{1+x}+1$.","m":"Expression conjuguée, ou nombre dérivé de $t\\mapsto\\sqrt t$ en $1$.","o":[["$\\frac{1}{2}$",1,"Juste : $\\frac{1}{\\sqrt1+1}=\\frac12$."],["$1$",0,"Le facteur $\\frac12$ de la dérivée de la racine est oublié."],["$0$",0,"Numérateur et dénominateur tendent ensemble vers $0$ : c'est une forme indéterminée."],["$2$",0,"Le dénominateur tend vers $2$ : la limite vaut son inverse, pas $2$."]]},
 {"n":"Fonction réciproque","d":1,"s":"Une fonction $f$ est continue et strictement croissante sur $[1;5]$, avec $f(1) = -3$, $f(2) = 0$ et $f(5) = 7$. Elle admet donc une fonction réciproque $f^{-1}$. Que vaut $f^{-1}(0)$, et sur quel intervalle $f^{-1}$ est-elle définie ?","h":"$f^{-1}(y) = x \\Leftrightarrow f(x) = y$ ; et $f^{-1}$ est définie sur $f(I)$.","m":"Pour $f^{-1}$ : les rôles s'échangent, départ ↔ arrivée et antécédent ↔ image.","o":[["$f^{-1}(0) = 2$, sur $[-3;7]$",1,"$f(2) = 0$ donne $f^{-1}(0) = 2$ ; $f^{-1}$ est définie sur l'image $f([1;5]) = [-3;7]$."],["$f^{-1}(0) = 2$, sur $[1;5]$",0,"$[1;5]$ est l'ensemble de départ de $f$ ; $f^{-1}$ part de l'ensemble image, $[-3;7]$."],["$f^{-1}(0) = -3$, sur $[-3;7]$",0,"$-3$ est $f(1)$ ; $f^{-1}(0)$ est le nombre dont l'image par $f$ vaut $0$, c'est-à-dire $2$."],["$f^{-1}(0) = 7$, sur $[1;5]$",0,"Tu as confondu les données et inversé les intervalles : $f(5) = 7$ dit que $f^{-1}(7) = 5$, cela ne concerne pas l'antécédent de $0$."]]},
 {"n":"Fonction réciproque","d":2,"s":"$f(x) = x^3 + 1$ est une bijection de $\\mathbb R$ sur $\\mathbb R$. $f^{-1}(9)$ vaut :","h":"$f^{-1}(9)$ est l'unique $x$ tel que $f(x) = 9$.","m":"$y = f(x) \\Leftrightarrow x = f^{-1}(y)$ ; ne confonds pas $f^{-1}$ et $\\frac1f$.","o":[["$2$",1,"On résout $x^3 + 1 = 9$, soit $x^3 = 8$."],["$730$",0,"C'est $f(9)$, pas $f^{-1}(9)$."],["$\\sqrt[3]{10}$",0,"Tu as ajouté $1$ au lieu de le retrancher : $x^3 = 9 - 1$."],["$\\dfrac{1}{730}$",0,"$f^{-1}$ n'est pas $\\frac1f$."]]}
]},
"pc":{"subject":"Physique-Chimie","chapter":"Ondes mécaniques progressives","qs":[
 {"n":"La célérité","d":1,"s":"Une onde parcourt $12\\ \\mathrm{m}$ en $40\\ \\mathrm{ms}$. Sa célérité vaut :","h":"Convertis d'abord la durée en secondes, puis divise la distance par la durée.","m":"Convertis **toujours** en unités SI avant de calculer, puis vérifie l'ordre de grandeur : quelques centaines de $\\mathrm{m\\,s^{-1}}$ est typique d'une onde sonore.","o":[["$3{,}0\\times10^{2}\\ \\mathrm{m\\,s^{-1}}$",1,"$c = \\dfrac{d}{\\Delta t} = \\dfrac{12}{40\\times10^{-3}} = 3{,}0\\times10^{2}\\ \\mathrm{m\\,s^{-1}}$."],["$3{,}0\\times10^{-1}\\ \\mathrm{m\\,s^{-1}}$",0,"Tu as divisé $12$ par $40$ sans convertir les millisecondes en secondes."],["$3{,}3\\times10^{-3}\\ \\mathrm{m\\,s^{-1}}$",0,"Tu as calculé $\\Delta t / d$ au lieu de $d / \\Delta t$."],["$4{,}8\\times10^{-1}\\ \\mathrm{m\\,s^{-1}}$",0,"Tu as multiplié $d$ par $\\Delta t$ au lieu de diviser."]]},
 {"n":"La célérité","d":2,"s":"Le son se propage à $3{,}4\\times10^{2}\\ \\mathrm{m\\,s^{-1}}$ dans l'air. On voit un éclair, puis on entend le tonnerre $6{,}0\\ \\mathrm{s}$ plus tard. L'orage se trouve à environ :","h":"Le délai mesuré est le temps mis par le **son** seul : la lumière de l'éclair arrive pratiquement tout de suite.","m":"Règle de terrain : environ **$1\\ \\mathrm{km}$ pour $3\\ \\mathrm{s}$** de délai entre l'éclair et le tonnerre.","o":[["$2{,}0\\ \\mathrm{km}$",1,"$d = c\\,\\Delta t = 340\\times6{,}0 = 2{,}0\\times10^{3}\\ \\mathrm{m}$ ; la lumière, elle, arrive quasi instantanément."],["$1{,}0\\ \\mathrm{km}$",0,"Tu as divisé par deux, comme pour un aller-retour : ici le son ne fait qu'un aller."],["$4{,}1\\ \\mathrm{km}$",0,"Tu as compté un aller-retour : le son va de l'orage vers toi, un seul trajet."],["$1{,}8\\times10^{-5}\\ \\mathrm{km}$",0,"Tu as calculé $\\Delta t / c$ : ce n'est pas homogène à une distance."]]},
 {"n":"Le retard temporel","d":1,"s":"Un point $M$ est à $d = 3{,}0\\ \\mathrm{m}$ de la source et la célérité de l'onde vaut $6{,}0\\ \\mathrm{m\\,s^{-1}}$. Le retard de $M$ vaut :","h":"Le retard est le temps mis par l'onde pour aller de la source jusqu'à $M$.","m":"$\\tau = d/c$ : contrôle l'homogénéité — des mètres divisés par des $\\mathrm{m\\,s^{-1}}$ donnent des secondes.","o":[["$0{,}50\\ \\mathrm{s}$",1,"$\\tau = \\dfrac{d}{c} = \\dfrac{3{,}0}{6{,}0} = 0{,}50\\ \\mathrm{s}$."],["$2{,}0\\ \\mathrm{s}$",0,"Tu as calculé $c/d$ au lieu de $d/c$ : le résultat n'est pas un temps."],["$18\\ \\mathrm{s}$",0,"Tu as multiplié $d$ par $c$ au lieu de diviser."],["$0{,}50\\ \\mathrm{ms}$",0,"Le calcul est bon mais l'unité est mille fois trop petite : $3{,}0/6{,}0$ donne des **secondes**."]]},
 {"n":"Le retard temporel","d":2,"s":"$M$ est à $d=2\\ \\mathrm{m}$ de la source, $v=4\\ \\mathrm{m\\cdot s^{-1}}$. Le retard vaut :","h":null,"m":null,"o":[["$0{,}5\\ \\mathrm{s}$",1,null],["$8\\ \\mathrm{s}$",0,null],["$2\\ \\mathrm{s}$",0,null],["$0{,}25\\ \\mathrm{s}$",0,null]]},
 {"n":"Transversale ou longitudinale","d":1,"s":"Une onde est dite longitudinale lorsque :","h":"Compare deux directions : celle du mouvement des points du milieu et celle de l'avancée de l'onde.","m":"Longitudinale = **le long de** la propagation. Transversale = **en travers** de la propagation.","o":[["la perturbation est parallèle à la direction de propagation",1,"C'est la définition : les points du milieu se déplacent dans la direction même où l'onde avance."],["la perturbation est perpendiculaire à la direction de propagation",0,"C'est la définition d'une onde **transversale**."],["l'onde se propage dans une seule direction de l'espace",0,"Tu confonds avec la **dimension** du milieu (onde à une dimension) : cela ne dit rien du type."],["l'onde se propage dans un milieu solide",0,"La nature du milieu ne décide pas du type : le son est longitudinal dans l'air comme dans l'acier."]]},
 {"n":"Transversale ou longitudinale","d":1,"s":"La secousse est verticale et l'onde progresse horizontalement le long de la corde : cette onde est :","h":"Compare la direction du mouvement des points de la corde à celle du déplacement de la perturbation.","m":"Toujours la même comparaison : direction de la perturbation contre direction de propagation.","o":[["transversale, car la perturbation est perpendiculaire à la direction de propagation",1,"Les points montent et descendent, l'onde avance horizontalement : les deux directions sont perpendiculaires."],["longitudinale, car la corde est un milieu à une seule dimension",0,"La dimension du milieu ne décide pas du type : une corde peut porter les deux sortes d'ondes."],["longitudinale, car la perturbation avance le long de la corde",0,"Tu as comparé la propagation à elle-même : c'est le mouvement des **points** qu'il faut comparer à la propagation."],["transversale, car la secousse est brève",0,"La conclusion est la bonne, mais la durée de la secousse n'y est pour rien."]]}
]},
"svt":{"subject":"SVT","chapter":"Libération de l'énergie : respiration et fermentation","qs":[
 {"n":"Comparer les deux voies","d":1,"s":"Pour une molécule de glucose, quels sont les bilans en ATP de la respiration et de la fermentation ?","h":"L'une des deux voies s'arrête à la glycolyse.","m":"38 contre 2 : un rapport de 19.","o":[["38 ATP pour la respiration, 2 ATP pour la fermentation",1,"La respiration rapporte 19 fois plus."],["2 ATP pour la respiration, 38 ATP pour la fermentation",0,"Les deux valeurs sont inversées."],["38 ATP pour la respiration, 4 ATP pour la fermentation",0,"La fermentation ne produit que les 2 ATP de la glycolyse."],["34 ATP pour la respiration, 2 ATP pour la fermentation",0,"34 est la part de la chaîne respiratoire ; le total est 38."]]},
 {"n":"Comparer les deux voies","d":2,"s":"Dans quels compartiments cellulaires chacune des deux voies se déroule-t-elle ?","h":"Où a lieu la glycolyse ? Où vont ensuite les pyruvates ?","m":"Pas de mitochondrie ⇒ pas de respiration, mais la fermentation reste possible.","o":[["Respiration : hyaloplasme et mitochondrie. Fermentation : hyaloplasme seul",1,"La respiration commence dans l'hyaloplasme (glycolyse) et se poursuit dans la mitochondrie."],["Respiration : mitochondrie seule. Fermentation : hyaloplasme et mitochondrie",0,"La respiration commence par la glycolyse, hors de la mitochondrie ; la fermentation n'y entre jamais."],["Respiration : hyaloplasme seul. Fermentation : mitochondrie seule",0,"Les deux compartiments sont inversés."],["Respiration et fermentation : toutes deux dans la mitochondrie",0,"La fermentation est entièrement hyaloplasmique."]]},
 {"n":"Le bilan énergétique","d":1,"s":"Combien de molécules d'ATP l'oxydation complète d'une molécule de glucose fournit-elle (valeur attendue au BAC) ?","h":"ATP directs + ATP issus des coenzymes réduits.","m":"$4 + 34 = 38$.","o":[["38 ATP",1,"4 ATP directs et 34 ATP produits par la chaîne respiratoire."],["2 ATP",0,"C'est le bilan de la fermentation, ou de la glycolyse seule."],["4 ATP",0,"Ce sont seulement les ATP produits directement (glycolyse et cycle de Krebs)."],["34 ATP",0,"C'est la part de la chaîne respiratoire : il faut y ajouter les 4 ATP directs."]]},
 {"n":"Le bilan énergétique","d":2,"s":"Par molécule de glucose, combien d'ATP sont produits directement, sans passer par la chaîne respiratoire ?","h":"Le cycle de Krebs tourne deux fois par glucose.","m":"Tout ce qui se passe dans la matrice est à multiplier par 2.","o":[["4 : 2 par la glycolyse et 2 par le cycle de Krebs",1,"Le cycle de Krebs donne 1 ATP par pyruvate, donc 2 par glucose."],["3 : 2 par la glycolyse et 1 par le cycle de Krebs",0,"Tu as compté le cycle de Krebs une seule fois : un glucose donne deux pyruvates."],["2 : tous par la glycolyse, le cycle de Krebs n'en produit pas",0,"Le cycle de Krebs produit 1 ATP par tour, soit 2 par glucose."],["34 : tous par la chaîne respiratoire",0,"Ces 34 ATP viennent des coenzymes réduits : ils ne sont pas produits directement."]]},
 {"n":"Une oxydation incomplète","d":1,"s":"La fermentation est :","h":"Trois caractères : incomplète, sans $\\mathrm{O_2}$, hyaloplasme.","m":"Fermentation = incomplète + anaérobie + hyaloplasmique.","o":[["une oxydation incomplète de la matière organique, sans dioxygène, dans l'hyaloplasme",1,"Elle ne fait pas intervenir la mitochondrie."],["une oxydation complète de la matière organique, avec dioxygène, dans la mitochondrie",0,"C'est la respiration cellulaire."],["une oxydation incomplète de la matière organique, avec dioxygène, dans la matrice",0,"La fermentation se déroule en absence de dioxygène et hors de la mitochondrie."],["une synthèse de matière organique, sans dioxygène, dans l'hyaloplasme",0,"La fermentation dégrade le glucose : elle ne le fabrique pas."]]},
 {"n":"Une oxydation incomplète","d":2,"s":"Quelle étape la fermentation et la respiration ont-elles en commun ?","h":"Laquelle de ces étapes ne consomme pas de dioxygène et se déroule dans l'hyaloplasme ?","m":"Glycolyse : anaérobie et commune aux deux voies.","o":[["La glycolyse",1,"Les deux voies commencent par la dégradation du glucose en 2 pyruvates dans l'hyaloplasme."],["Le cycle de Krebs",0,"Il n'a lieu que dans la matrice mitochondriale, lors de la respiration."],["La chaîne respiratoire",0,"Elle exige le dioxygène et la membrane interne de la mitochondrie."],["La réduction du pyruvate",0,"Elle est propre à la fermentation."]]}
]}
